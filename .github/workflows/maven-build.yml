name: Deploy petclinic-app

on:
  push:
    branches:
      - "*"

jobs:
  build-push-deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Install Maven (if not already installed on the self-hosted runner)
      - name: Install Maven
        run: |
          if ! mvn -v &> /dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y maven
          fi
          mvn -v

      # 3️⃣ Build Spring Boot Petclinic with Maven
      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      # 4️⃣ Ensure Docker daemon is running
      - name: Ensure Docker daemon is running
        run: |
          if ! docker info &> /dev/null; then
            echo "Docker daemon is not running. Starting..."
            sudo nohup dockerd --host=unix:///var/run/docker.sock \
              --containerd=/run/containerd/containerd.sock > ~/dockerd.log 2>&1 &
            sleep 10
          fi

          sudo chmod 777 /var/run/docker.sock
          docker info

      # 5️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          echo "✅ Logged into Docker Hub!"

      # 6️⃣ Build the Docker image using the JAR
      - name: Build Docker image
        run: |
          docker build -t petclinic:latest .

      # 7️⃣ Tag image for Docker Hub
      - name: Tag image
        run: |
          docker tag petclinic:latest koffimensah/petclinic:latest
          docker tag petclinic:latest koffimensah/petclinic:v1.0

      # 8️⃣ Push image to Docker Hub
      - name: Push Docker images
        run: |
          docker push koffimensah/petclinic:latest
          docker push koffimensah/petclinic:v1.0

      # 9️⃣ Deploy using Docker Compose
      - name: Deploy petclinic stack
        run: |
          docker compose pull
          docker compose up -d


          distribution: 'adopt'
          cache: maven
      - name: Build with Maven Wrapper
        run: ./mvnw -B package
