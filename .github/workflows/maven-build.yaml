name: Deploy petclinic-app

on:
  push:
    branches:
      - "**"     # runs on ALL branches

jobs:
  build-push-deploy:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Install Maven
      - name: Install Maven
        run: |
          if ! mvn -v &> /dev/null; then
            sudo apt-get update -y
            sudo apt-get install -y maven
          fi
          mvn -v

      # 3️⃣ Install Docker CE
      - name: Install Docker
        run: |
          if ! command -v docker &> /dev/null; then
            echo "🔧 Installing Docker..."
            sudo apt-get update -y
            sudo apt-get install -y ca-certificates curl gnupg lsb-release

            sudo mkdir -p /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg

            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu \
              $(lsb_release -cs) stable" \
              | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null

            sudo apt-get update -y
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io
            echo "✅ Docker installed!"
          fi
          sudo chmod 777 /var/run/docker.socket
          sudo systemctl enable docker
          sudo systemctl start docker

          docker --version
          sudo systemctl status docker --no-pager

      # 4️⃣ Build JAR with Maven
      - name: Build JAR with Maven
        run: mvn clean package -DskipTests

      # 5️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
          echo "✅ Logged into Docker Hub!"

      # 6️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t petclinic:latest .

      # 7️⃣ Tag image
      - name: Tag image
        run: |
          docker tag petclinic:latest koffimensah/petclinic:latest
          docker tag petclinic:latest koffimensah/petclinic:v1.0

      # 8️⃣ Push images
      - name: Push Docker images
        run: |
          docker push koffimensah/petclinic:latest
          docker push koffimensah/petclinic:v1.0

      # 9️⃣ Deploy service
      - name: Deploy petclinic stack
        run: |
          docker compose pull
          docker compose up -d
